plugins {
    id 'com.android.application'
}

android {
    namespace 'com.msa.assistant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.msa.assistant'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }
}
